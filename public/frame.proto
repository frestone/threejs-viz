// -----------------------------------------------------------------------------
// 统一数据模型（protobuf 版）——与后端 viz-core/proto/frame.proto 保持一致。
// 前端通过 protobufjs 运行时 load("/frame.proto") 解码 WebSocket 推流的 Frame。
// 【重要】此文件必须与后端 frame.proto 严格同步，任何字段/枚举改动需两端一致。
// -----------------------------------------------------------------------------
syntax = "proto3";

package viz;

option optimize_for = SPEED;

// 三维向量（右手系，x 前 / y 左 / z 上）。
message Vec3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

// 基础几何图元类型。
enum GeometryKind {
  POINT = 0;      // 单点
  LINESTRIP = 1;  // 折线/点集
  BOX = 2;        // 有向包围盒（position + size + heading）
  POLYGON = 3;    // 多边形点集（闭合环）
  TEXT = 4;       // 文本标注（position + text）
  ARROW = 5;      // 箭头（position + heading + size 缩放）
  PLANNING_TRAJECTORY = 6; // 规划轨迹带（points 折线沿法向扩展宽度成多边形，宽度见 style.width）
}

// 通用几何单元：
//   POINT     -> position
//   LINESTRIP -> points
//   BOX       -> position + size + heading
//   POLYGON   -> points（闭合环）
//   TEXT      -> position + text
//   ARROW     -> position + heading + size（缩放比例）
message GeometryItem {
  Vec3 position = 1;           // POINT/BOX/TEXT/ARROW 用
  repeated Vec3 points = 2;    // LINESTRIP/POLYGON 用
  Vec3 size = 3;               // BOX 用：length(x)/width(y)/height(z)；ARROW 用：缩放比例
  float heading = 4;           // BOX/ARROW 用：弧度
  string text = 5;             // TEXT 用
  int32 id = 6;
  int32 type = 7;              // 供渲染层 colorByType 上色
  float score = 8;
}

// 一个图层的几何数据：几何类型 + 该类型的若干实例。
message LayerData {
  GeometryKind kind = 1;
  repeated GeometryItem items = 2;
}

// 一帧图像（相机/传感器画面）。data 为编码后的原始字节。
message Image {
  string format = 1;   // 编码格式："jpeg" / "png" / "rgb8" 等
  uint32 width = 2;    // 像素宽（rgb8 等裸格式需要）
  uint32 height = 3;   // 像素高
  bytes data = 4;      // 编码字节（jpeg/png）或裸像素
  double t = 5;        // 采集时间戳（秒），可选
}

// 一帧点云。xyz 打平存储（[x0,y0,z0, ...]），点数 = size(xyz)/3。
// rgb 可选逐点颜色（打平，0..1）；intensity 可选逐点强度；encoding 预留压缩标识。
message PointCloud {
  repeated float xyz = 1 [packed = true];
  repeated float rgb = 2 [packed = true];
  repeated float intensity = 3 [packed = true];
  double t = 4;
  string frame_id = 5;
  string encoding = 6;
}

// 一份原始数据（RawData）：不在默认传输通道、需前端勾选后按需订阅的“另一类数据”。
// 承载任意原始传感器字节流（如雷达回波 / 未解码原始帧 / 厂商私有二进制）。
message RawData {
  string topic = 1;     // 来源 topic
  string format = 2;    // 数据语义标识，供解析分派
  bytes data = 3;       // 原始字节（完整保留）
  double t = 4;         // 采集时间戳（秒），可选
  string frame_id = 5;  // 可选坐标系标识
  string encoding = 6;  // 预留编码标识，""=raw
  uint64 seq = 7;       // 可选原始消息序号
}

// 单条曲线的画法。
enum ChartSeriesKind {
  CS_LINE = 0;        // 折线（默认）
  CS_SCATTER = 1;     // 离散点
  CS_BAND_UPPER = 2;  // 约束带上界
  CS_BAND_LOWER = 3;  // 约束带下界
}

// 一条命名曲线：等长的 x/y 采样序列。
message ChartSeries {
  string name = 1;
  repeated float x = 2;
  repeated float y = 3;
  ChartSeriesKind kind = 4;
  string color = 5;
}

// 一张 2D 图表：标题 + 轴标注 + 若干曲线。
message ChartData {
  string title = 1;
  string x_label = 2;
  string y_label = 3;
  repeated ChartSeries series = 4;
}

// 单帧：以自车定位时刻为锚点，聚合当帧所有图层的几何。
message Frame {
  double t = 1;
  map<string, LayerData> layers = 2;
  Vec3 ego_anchor = 3;
  float ego_yaw = 4;
  bool ego_valid = 5;
  map<string, ChartData> charts = 6;
  // 按相机/通道名索引的图像容器（key = 相机名，如 "front" / "rear"）。
  map<string, Image> images = 7;
  // 按通道名索引的点云容器（key = 点云图层名，见 decoder.json pointCloudLayer.name）。
  map<string, PointCloud> point_clouds = 8;
  // 按通道名索引的原始数据容器（key = RawData 图层名）。默认不下发，仅勾选订阅后按需注入。
  map<string, RawData> raw_data = 9;
}

// 数据集：有序帧序列。
message Dataset {
  repeated Frame frames = 1;
}